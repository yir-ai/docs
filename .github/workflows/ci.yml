name: Yir Docs CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.26.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run publish:check
      - run: pnpm run check
      - name: Test development service ownership and restart
        shell: pwsh
        run: ./scripts/dev-service.test.ps1
      - run: pnpm run build
      - run: pnpm run release:verify
      - run: pnpm run origin:smoke
        env:
          YIR_DOCS_NGINX_IMAGE: nginx:1.28.3-alpine
      - uses: actions/upload-artifact@v4
        with:
          name: yir-docs-origin-${{ github.sha }}
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
