# Include this file inside the legacy docs.yir.ai server block after its TLS
# configuration. Query parameters are preserved explicitly.

location = / {
  return 308 https://yir.ai/docs/$is_args$args;
}

location = /zh {
  return 308 https://yir.ai/zh/docs$is_args$args;
}

location ~ ^/zh/(.*)$ {
  return 308 https://yir.ai/zh/docs/$1$is_args$args;
}

location / {
  return 308 https://yir.ai/docs$uri$is_args$args;
}
