# Include this file inside the local.yir.ai HTTPS server block before the
# catch-all proxy to yir-web. Blume already serves both public path prefixes, so
# these locations preserve the incoming URI without a rewrite.

location = /docs {
  return 308 /docs/;
}

location = /zh/docs {
  return 308 /zh/docs/;
}

location ^~ /docs/ {
  proxy_pass http://localhost:40084;
  proxy_http_version 1.1;
  proxy_set_header Host localhost:40084;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_buffering off;
}

location ^~ /zh/docs/ {
  proxy_pass http://localhost:40084;
  proxy_http_version 1.1;
  proxy_set_header Host localhost:40084;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_buffering off;
}
