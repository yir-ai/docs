# Include this file inside the production yir.ai server block before the
# catch-all proxy to yir-web.

location = /docs {
  return 308 /docs/;
}

location = /zh/docs {
  return 308 /zh/docs/;
}

location ^~ /docs/_astro/ {
  root /srv/yir/docs/current;
  try_files $uri =404;
  access_log off;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  add_header X-Content-Type-Options nosniff always;
}

location ^~ /docs/ {
  root /srv/yir/docs/current;
  index index.html;
  try_files $uri $uri/index.html =404;
  add_header Cache-Control "public, max-age=60, s-maxage=300, stale-while-revalidate=86400" always;
  add_header X-Content-Type-Options nosniff always;
}

location ^~ /zh/docs/ {
  root /srv/yir/docs/current;
  index index.html;
  try_files $uri $uri/index.html =404;
  add_header Cache-Control "public, max-age=60, s-maxage=300, stale-while-revalidate=86400" always;
  add_header X-Content-Type-Options nosniff always;
}
